version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT_INTERNAL:-8080}"
    environment:
      # Mapeando as variáveis para o padrão que o Spring Boot reconhece automaticamente
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/${DB_NAME:-pagina}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-2713}
      - SERVER_PORT=${BACKEND_PORT_INTERNAL:-8080}
    networks:
      - app-network
    # Garante que o banco suba antes do backend
    depends_on:
      - postgres_db 

networks:
  app-network:
    external: true